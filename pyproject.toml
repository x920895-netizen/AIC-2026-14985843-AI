[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-evolve"
version = "1.2.0"
description = "循证演化：自进化智能体的发布门禁（两级门禁、统计口径、决策凭证、在线闭环、可回滚发布）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "2026 循证演化 Team" }]
keywords = ["evaluation", "release-gate", "self-evolving-agent", "prompt-optimization", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# 复现历史实验与运行离线演示所需的依赖（含独立评价器 DSPy）。
research = [
  "dspy==3.4.1",
  "bm25s==0.2.12",
  "PyStemmer==3.1.0",
]
# 校园问答示例（examples/campus_qa）的 Web 依赖；核心 harness 不依赖它们。
campus = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
]
# 官方 SDK（可选）：harness 自带 urllib 实现，不依赖它；装它是为了方便
# 在同一环境里写自定义 runner 或对照官方客户端行为。
online = ["openai>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
evidence-evolve = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.runners", "harness.proposers", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
